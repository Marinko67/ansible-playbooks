---
- name: Server und Docker updaten, Hawser aktualisieren, aufräumen und ggf. neustarten

  hosts: all
  become: yes

  tasks:
    - name: Apt-Cache aktualisieren und alle Pakete (inkl. Docker) upgraden
      ansible.builtin.apt:
        update_cache: yes
        upgrade: safe
        autoremove: yes

    - name: Neuestes Hawser-Image herunterladen (Docker Compose Pull)
      ansible.builtin.shell:
        cmd: docker compose pull hawser

    - name: Hawser-Container mit neuem Image aktualisieren und starten
      ansible.builtin.shell:
        cmd: docker compose up -d hawser

    - name: Alte, gestoppte Container und ungenutzte Docker-Ressourcen aufräumen
      ansible.builtin.shell:

    - name: Prüfen, ob ein Neustart erforderlich ist
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Server neu starten, falls ein Kernel-Update das erfordert
      ansible.builtin.reboot:
        msg: "Automatischer Neustart durch Ansible nach System-Update"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required.stat.exists
